name: otbasy_capital
description: "Отбасы капиталы — КМ07 финалдық мобильді жоба"
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_svg: ^2.2.0
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  provider: ^6.1.5+1
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  image_picker: ^1.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
