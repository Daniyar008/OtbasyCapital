services:
  - type: web
    name: otbasy-capital
    runtime: static
    branch: main
    buildCommand: bash tools/render_build.sh
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: no-cache
      - path: /main.dart.js
        name: Cache-Control
        value: no-cache
